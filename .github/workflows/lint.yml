name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  verify:
    name: meta-linter
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install pinned official validator
        run: python -m pip install -r requirements/skills-ref.txt

      - name: Check Bash syntax
        run: for f in scripts/*.sh evals/ablation/*.sh; do bash -n "$f"; done

      - name: Run arc-check behavioral tests
        run: bash scripts/test.sh --verbose

      - name: Run full repository lint
        run: SKILLS_REF_BIN="$(command -v skills-ref)" bash scripts/lint.sh --all --verbose

      - name: Check tag-release parity
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: bash scripts/lint.sh tag-release-parity --verbose
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
