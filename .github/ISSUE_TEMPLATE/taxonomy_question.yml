name: Taxonomy question
description: A behavior that feels like a failure but does not map to a named have-not.
title: "[taxonomy] "
labels: [taxonomy-question]
body:
  - type: markdown
    attributes:
      value: |
        The have-nots in SKILL.md are arc-ready's named failure modes. If you see a behavior that
        feels like a failure but matches none of them, file this issue so the maintainer can point
        you at an existing name or consider a new one. A new name needs evidence that the behavior
        is distinct and that current models actually produce it.
  - type: dropdown
    id: tier
    attributes:
      label: Tier where the behavior was observed
      options:
        - "Tier 0 (ledger)"
        - "Tier 1.1 (PRD)"
        - "Tier 1.2 (architecture)"
        - "Tier 1.3 (roadmap)"
        - "Tier 1.4 (stack)"
        - "Tier 2.1 (repo)"
        - "Tier 2.2 (build)"
        - "Tier 3.1 (deploy)"
        - "Tier 3.2 (observe)"
        - "Tier 3.3 (launch)"
        - "Tier 3.4 (harden)"
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: The behavior
      description: What did the agent (or its output) do that felt wrong? Name the model and harness.
    validations:
      required: true
  - type: textarea
    id: existing_check
    attributes:
      label: Which existing have-nots did you check?
      description: List the names from SKILL.md you considered.
    validations:
      required: true
  - type: textarea
    id: distinction
    attributes:
      label: Why is this distinct?
      description: Be concrete. "It feels different" is not enough.
    validations:
      required: true
