name: Feature request or improvement
description: Suggest a change to arc-ready.
title: "[feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        arc-ready 2.x keeps the default context small on purpose. A proposal is strongest when it shows
        that current models fail without the change (an ablation result or a reproducible transcript),
        or when it moves a rule out of prose and into scripts/arc-check.sh where it is enforced.

        For a behavior that feels like a failure but matches no named have-not, use the
        "taxonomy question" template instead.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: A concrete failure you observed, with the model and harness, not "it would be nice if".
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What would change in SKILL.md, arc-check.sh, the guided pack, or the evaluations?
    validations:
      required: true
  - type: dropdown
    id: product_form
    attributes:
      label: Affected project form
      options:
        - All forms
        - Web application
        - API or service
        - CLI or SDK
        - Mobile or desktop
        - Data or ML
        - Infrastructure or IaC
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: evaluation
    attributes:
      label: Evidence
      description: The test in scripts/test.sh or the ablation task that would prove the change works.
  - type: dropdown
    id: scope
    attributes:
      label: Where it belongs
      options:
        - "Script enforcement (arc-check.sh)"
        - "SKILL.md (always-loaded context)"
        - "Guided pack (opt-in, smaller models)"
        - "Unsure"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
